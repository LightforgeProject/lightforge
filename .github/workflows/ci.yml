name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The launcher links libc, libm, libgcc_s and libudev and opens
      # everything else at run time, so libudev's headers and a toolchain are
      # the whole build environment. gilrs finds libudev through pkg-config.
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked --all-targets

      - name: Test
        run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev

      # Pinned, not @stable: every six-week release adds lints, and with
      # -D warnings that turns a toolchain bump into a red main on a commit
      # that changed nothing. Bumped deliberately, as its own commit.
      # Its own job so it keeps its own cache; sharing one with the @stable
      # build would invalidate every artifact on both sides.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev

      # Cargo.toml promises 1.90; this is what keeps that promise true.
      # The floor is wgpu-hal's ordered-float, reached through iced.
      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --locked

  cli-doc:
    name: docs/CLI.md matches the binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: make check-cli-doc

  deny:
    name: Advisories, licenses and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
