version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR for every semver-compatible bump; a PR per crate floods the
    # mirror for what is mostly `cargo update`.
    groups:
      compatible:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
