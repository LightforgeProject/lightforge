[workspace]
resolver = "2"
members = ["crates/core", "crates/launcher-cli", "crates/launcher-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
repository = "https://git.tuxcore.pro/kenny/lightforge.git"

[workspace.dependencies]
lightforge-core = { path = "crates/core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
iced = { version = "0.14", features = ["tokio", "image", "advanced", "lazy", "canvas"] }
# The same 0.24 iced decodes with; the GUI decodes artwork itself, once.
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
md5 = "0.8"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
blte = "0.4"
ngdp-crypto = "0.4"
tact-parser = "0.4"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
# Addon packages are plain deflate zips; nothing else is needed, and the
# default feature set drags in bzip2/zstd/aes for formats WoW never uses.
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
