[workspace]
resolver = "2"
members = ["crates/core", "crates/launcher-cli", "crates/launcher-gui"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
repository = "https://git.tuxcore.pro/kenny/lightforge.git"

[workspace.dependencies]
lightforge-core = { path = "crates/core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `sysinfo` is for `iced::system::information`: the renderer's own adapter
# and backend, which a bug report about a game that will not draw needs and
# which nothing outside the renderer can answer.
iced = { version = "0.14", features = ["tokio", "image", "advanced", "lazy", "canvas", "sysinfo"] }
# The same 0.24 iced decodes with; the GUI decodes artwork itself, once.
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
md5 = "0.8"
open = "5"
# The file picker: the XDG desktop portal, spoken directly. `async-std` rather
# than the default `tokio` feature only to leave zbus exactly as iced already
# builds it — this adds no second D-Bus stack.
ashpd = { version = "0.12", default-features = false, features = ["async-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
# Default features are deliberately off: the default transport is reqwest with
# **native-tls**, which the release container has no OpenSSL for and which the
# rest of the workspace replaced with rustls; `panic` would install a panic
# hook, and a report is only ever sent with someone's explicit consent; and
# `release-health` sends a session envelope per launch that GlitchTip has no
# use for.
sentry = { version = "0.49", default-features = false, features = ["reqwest", "rustls", "backtrace", "contexts"] }
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# For the screenshot a report carries: GlitchTip drops envelope attachments,
# so the image travels inside the event as a data URI.
base64 = "0.22"
blte = "0.4"
ngdp-crypto = "0.4"
tact-parser = "0.4"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
# Addon packages are plain deflate zips; nothing else is needed, and the
# default feature set drags in bzip2/zstd/aes for formats WoW never uses.
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
