[package]
name = "lightforge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UI-agnostic core: product models, path layout, .build.info engine, TACT/CASC, addons"

[dependencies]
blte.workspace = true
directories.workspace = true
flate2.workspace = true
liblzma.workspace = true
futures-util.workspace = true
# statvfs, for free space in Settings > Storage.
libc.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
md5.workspace = true
ngdp-crypto.workspace = true
tact-parser.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# `time` is for the download rate limiter's sleeps; relying on another
# crate to enable it would break the moment that dependency changed.
tokio = { workspace = true, features = ["fs", "io-util", "rt", "time"] }
toml.workspace = true
zip.workspace = true
zstd.workspace = true

[dev-dependencies]
semver.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
