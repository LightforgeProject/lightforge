[package]
name = "lightforge-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lightforge-core = { path = "../crates/core" }

# Its own workspace: nightly-only, and kept out of the release build and CI.
[workspace]
members = ["."]

[[bin]]
name = "archive_index"
path = "fuzz_targets/archive_index.rs"
test = false
doc = false
bench = false

